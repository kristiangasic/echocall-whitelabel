# Run from the repository root: docker compose up -d
# Settings come from .env next to this file (APP_URL, APP_SECRET, ECHOCALL_API_KEY, ...).
name: echocall-whitelabel

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: echocall_whitelabel
      POSTGRES_USER: light
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U light -d echocall_whitelabel']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://light:${DB_PASSWORD}@db:5432/echocall_whitelabel
    ports:
      # The port on the host is yours to choose; 3000 is often taken already.
      - '${HTTP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
