# Run from the repository root: docker compose up -d
# Settings come from .env next to this file (APP_URL, APP_SECRET, ECHOCALL_API_KEY, ...).
name: echocall-whitelabel

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-echocall_whitelabel}
      POSTGRES_USER: ${DB_USER:-whitelabel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-whitelabel} -d ${DB_NAME:-echocall_whitelabel}']
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      # Keep automatic image updaters away from the database. Watchtower and the
      # like replace a container as soon as the tag moves, and this one holds the
      # live data while it runs. Upgrade Postgres on purpose, with a dump in hand.
      com.centurylinklabs.watchtower.enable: 'false'
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-whitelabel}:${DB_PASSWORD}@db:5432/${DB_NAME:-echocall_whitelabel}
    ports:
      # The port on the host is yours to choose; 3000 is often taken already.
      - '${HTTP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    labels:
      # This image is built right here and exists in no registry, so an updater
      # that goes looking for it can only find something that is not ours.
      com.centurylinklabs.watchtower.enable: 'false'
    restart: unless-stopped

volumes:
  db-data:
