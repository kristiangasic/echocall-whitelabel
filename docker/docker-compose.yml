# Run from the repository root: docker compose -f docker/docker-compose.yml up -d
# Reads the remaining settings (APP_URL, APP_SECRET, ECHOCALL_API_KEY, ...) from ../.env.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: echocall_light
      POSTGRES_USER: light
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U light -d echocall_light']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://light:${DB_PASSWORD}@db:5432/echocall_light
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
