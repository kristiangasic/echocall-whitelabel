# Security advisories reach the repository on their own; this keeps the ordinary
# updates coming in batches that are small enough to read.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular*', 'angular-eslint']
      nest:
        patterns: ['@nestjs/*']
      development:
        dependency-type: development
    ignore:
      # TypeScript 7 is the native compiler; Angular, the Nest CLI and
      # typescript-eslint do not build on it yet. Minors keep coming.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: '/docker'
    schedule:
      interval: monthly
    ignore:
      # The image follows Node's LTS line and moves majors on purpose, not
      # whenever a new odd release appears.
      - dependency-name: node
        update-types: ['version-update:semver-major']
