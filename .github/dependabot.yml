# Security advisories reach the repository on their own; this keeps the ordinary
# updates coming in batches that are small enough to read.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular*', 'angular-eslint']
      nest:
        patterns: ['@nestjs/*']
      development:
        dependency-type: development
        # Angular and Nest ship their build tooling as devDependencies, so a
        # plain dependency-type group claims @angular/build, @angular/cli and
        # @angular/compiler-cli and splits one framework release across two
        # pull requests. Neither half builds on its own: the runtime packages
        # without the compiler fail with "getDeferBlocksOfNode is not a
        # function", the compiler without the runtime cannot resolve
        # @angular/compiler at all. Excluding them here keeps every Angular
        # and Nest package in its own group, where they move together.
        exclude-patterns: ['@angular*', 'angular-eslint', '@nestjs/*']
    ignore:
      # TypeScript 7 is the native compiler; Angular, the Nest CLI and
      # typescript-eslint do not build on it yet. Minors keep coming.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: '/docker'
    schedule:
      interval: monthly
    ignore:
      # The image follows Node's LTS line and moves majors on purpose, not
      # whenever a new odd release appears.
      - dependency-name: node
        update-types: ['version-update:semver-major']
